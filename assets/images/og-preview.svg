<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#131720"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Glowing circle -->
  <circle cx="950" cy="200" r="220" fill="#00f59b" opacity="0.12" filter="url(#glow)"/>
  <circle cx="250" cy="450" r="180" fill="#00b4d8" opacity="0.1" filter="url(#glow)"/>

  <!-- Brand Box -->
  <rect x="100" y="90" width="80" height="80" rx="20" fill="#1f2636" stroke="#00f59b" stroke-width="2"/>
  <text x="140" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="url(#accentGrad)" text-anchor="middle">AME</text>

  <!-- Title & Subtitle -->
  <text x="100" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="#ffffff">Ahmed Mohamed</text>
  <text x="100" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="36" fill="url(#accentGrad)">Video Editor &amp; Graphic Designer</text>
  
  <text x="100" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="24" fill="#94a3b8">Transforming concepts into high-impact visual stories &amp; social media content.</text>

  <!-- Capability Pills -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="50" rx="25" fill="#1f2636" stroke="rgba(255,255,255,0.1)"/>
    <text x="90" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#f8fafc" text-anchor="middle">Video Editing</text>
    
    <!-- Pill 2 -->
    <rect x="200" y="0" width="220" height="50" rx="25" fill="#1f2636" stroke="rgba(255,255,255,0.1)"/>
    <text x="310" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#f8fafc" text-anchor="middle">Social Media Design</text>
    
    <!-- Pill 3 -->
    <rect x="440" y="0" width="170" height="50" rx="25" fill="#1f2636" stroke="rgba(255,255,255,0.1)"/>
    <text x="525" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#f8fafc" text-anchor="middle">AI Creative</text>
    
    <!-- Pill 4 -->
    <rect x="630" y="0" width="170" height="50" rx="25" fill="#1f2636" stroke="rgba(255,255,255,0.1)"/>
    <text x="715" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#f8fafc" text-anchor="middle">Storytelling</text>
  </g>

  <!-- Footer Tagline -->
  <text x="100" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#00f59b">⚡ Fast Delivery  •  🎬 9+ Years Experience  •  👁️ Millions of Views</text>
</svg>
